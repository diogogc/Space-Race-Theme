# =============================================================================
#  🛸 SPACE MISSION CONTROL // HYPRLAND MASTER CONFIGURATION
# =============================================================================

# -----------------------------------------------------------------------------
# Monitors
# -----------------------------------------------------------------------------
monitor = , preferred, auto, auto

# -----------------------------------------------------------------------------
# Programs
# -----------------------------------------------------------------------------
$terminal = /usr/bin/ghostty
$fileManager = nautilus
$menu = $HOME/.local/bin/dsky-launcher

# -----------------------------------------------------------------------------
# Autostart
# -----------------------------------------------------------------------------
exec-once = $HOME/.local/bin/hyprland-ipc-bridge
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprpaper
exec-once = waybar
exec-once = firefox
exec-once = $HOME/.local/bin/space-idle-daemon

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita-dark
env = COLOR_SCHEME,prefer-dark
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# -----------------------------------------------------------------------------
# Dynamic Mission Theme
# -----------------------------------------------------------------------------
source = ~/.config/hypr/theme-current.conf

# -----------------------------------------------------------------------------
# Look and Feel Defaults
# -----------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# -----------------------------------------------------------------------------
# Curves & Animations
# -----------------------------------------------------------------------------
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear, 0, 0, 1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1
bezier = quick, 0.15, 0, 0.1, 1

animation = global, 1, 10, default
animation = border, 1, 5.39, easeOutQuint
animation = windows, 1, 4.79, easeOutQuint
animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
animation = windowsOut, 1, 1.49, linear, popin 87%
animation = fadeIn, 1, 1.73, almostLinear
animation = fadeOut, 1, 1.46, almostLinear
animation = fade, 1, 3.03, quick
animation = layers, 1, 3.81, easeOutQuint
animation = layersIn, 1, 4, easeOutQuint, fade
animation = layersOut, 1, 1.5, linear, fade
animation = fadeLayersIn, 1, 1.79, almostLinear
animation = fadeLayersOut, 1, 1.39, almostLinear
animation = workspaces, 1, 3.5, easeOutQuint, slide
animation = workspacesIn, 1, 3.5, easeOutQuint, slide
animation = workspacesOut, 1, 3.5, easeOutQuint, slide
animation = specialWorkspaceIn, 1, 3.5, easeOutQuint, slide
animation = specialWorkspaceOut, 1, 3.5, easeOutQuint, slide
animation = zoomFactor, 1, 7, quick

# -----------------------------------------------------------------------------
# Layouts
# -----------------------------------------------------------------------------
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# -----------------------------------------------------------------------------
# Input & Devices
# -----------------------------------------------------------------------------
input {
    kb_layout = br
    kb_variant = thinkpad
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# -----------------------------------------------------------------------------
# Keybindings
# -----------------------------------------------------------------------------
$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, T, exec, $HOME/.local/bin/space-theme-switch next
bind = $mainMod ALT, T, exec, $HOME/.local/bin/space-theme-config
bind = $mainMod ALT, W, exec, $HOME/.local/bin/space-wallpaper next
bind = $mainMod SHIFT, K, exec, $HOME/.local/bin/space-keybinds
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, M, exec, $HOME/.local/bin/space-power-menu
bind = $mainMod, Escape, exec, $HOME/.local/bin/space-power-menu
bind = $mainMod SHIFT, N, exec, $HOME/.local/bin/space-network-dialog
bind = $mainMod SHIFT, C, exec, $HOME/.local/bin/space-telemetry-dialog
bind = $mainMod SHIFT, E, exec, $HOME/.local/bin/space-energy-dialog
bind = $mainMod SHIFT, V, exec, $HOME/.local/bin/space-capcom-dialog
bind = $mainMod SHIFT, A, exec, $HOME/.local/bin/space-capcom-dialog
bind = $mainMod SHIFT, D, exec, $HOME/.local/bin/space-default-apps
bind = $mainMod SHIFT, R, exec, $HOME/.local/bin/space-display
bind = $mainMod SHIFT, O, exec, $HOME/.local/bin/space-screensaver
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, L, exec, command -v hyprlock >/dev/null 2>&1 && hyprlock || (command -v swaylock >/dev/null 2>&1 && swaylock || loginctl lock-session)
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# Apollo Alt+Tab / Super+Tab Mission Window Switcher
bind = ALT, TAB, exec, $HOME/.local/bin/space-switcher next
bind = ALT SHIFT, TAB, exec, $HOME/.local/bin/space-switcher prev
bindr = ALT, Alt_L, exec, $HOME/.local/bin/space-switcher release
bindr = ALT, Alt_R, exec, $HOME/.local/bin/space-switcher release
bind = $mainMod, TAB, exec, $HOME/.local/bin/space-switcher next
bind = $mainMod SHIFT, TAB, exec, $HOME/.local/bin/space-switcher prev
bindr = $mainMod, Super_L, exec, $HOME/.local/bin/space-switcher release
bindr = $mainMod, Super_R, exec, $HOME/.local/bin/space-switcher release

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special Workspace (Magic)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll Workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse window move / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshot & Screen Recording Keybindings
bind = , Print, exec, $HOME/.local/bin/space-capture area
bind = CTRL, Print, exec, $HOME/.local/bin/space-capture full
bind = SHIFT, Print, exec, $HOME/.local/bin/space-tools-dialog rec
bind = $mainMod SHIFT, P, exec, $HOME/.local/bin/space-tools-dialog

# -----------------------------------------------------------------------------
# Window & Layer Rules
# -----------------------------------------------------------------------------
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Space Dialogs & Custom Windows
windowrulev2 = float, class:^hyprland-run$
windowrulev2 = move 20 monitor_h-120, class:^hyprland-run$

windowrulev2 = float, class:^space-tools-dialog$
windowrulev2 = center, class:^space-tools-dialog$
windowrulev2 = pin, class:^space-tools-dialog$

windowrulev2 = float, class:^space-display$
windowrulev2 = center, class:^space-display$
windowrulev2 = pin, class:^space-display$

windowrulev2 = float, class:^space-theme-config$
windowrulev2 = center, class:^space-theme-config$
windowrulev2 = pin, class:^space-theme-config$

windowrulev2 = float, class:^space-switcher$
windowrulev2 = center, class:^space-switcher$
windowrulev2 = pin, class:^space-switcher$

windowrulev2 = float, class:^space-power-menu$
windowrulev2 = center, class:^space-power-menu$
windowrulev2 = pin, class:^space-power-menu$

windowrulev2 = float, class:^dsky-launcher$
windowrulev2 = center, class:^dsky-launcher$
windowrulev2 = pin, class:^dsky-launcher$

windowrulev2 = float, class:^space-telemetry-dialog$
windowrulev2 = center, class:^space-telemetry-dialog$

windowrulev2 = float, class:^space-energy-dialog$
windowrulev2 = center, class:^space-energy-dialog$

windowrulev2 = float, class:^space-network-dialog$
windowrulev2 = center, class:^space-network-dialog$

windowrulev2 = float, class:^(space-capcom-dialog|space-vox-dialog)$
windowrulev2 = center, class:^(space-capcom-dialog|space-vox-dialog)$

windowrulev2 = float, class:^space-default-apps$
windowrulev2 = center, class:^space-default-apps$

windowrulev2 = float, class:^space-screensaver-config$
windowrulev2 = center, class:^space-screensaver-config$

windowrulev2 = float, class:^space-iss-dialog$
windowrulev2 = center, class:^space-iss-dialog$

windowrulev2 = float, class:^space-keybinds$
windowrulev2 = center, class:^space-keybinds$

windowrulev2 = fullscreen, class:^space-screensaver$
windowrulev2 = pin, class:^space-screensaver$

windowrulev2 = float, class:(.*polkit.*|.*Polkit.*|org.kde.polkit-kde-authentication-agent-1)
windowrulev2 = center, class:(.*polkit.*|.*Polkit.*|org.kde.polkit-kde-authentication-agent-1)
windowrulev2 = pin, class:(.*polkit.*|.*Polkit.*|org.kde.polkit-kde-authentication-agent-1)

windowrulev2 = float, title:^(Open File|Save File|Save As|Confirm|Authentication|PolicyKit|Import VPN.*)$
windowrulev2 = center, title:^(Open File|Save File|Save As|Confirm|Authentication|PolicyKit|Import VPN.*)$
windowrulev2 = pin, title:^(Open File|Save File|Save As|Confirm|Authentication|PolicyKit|Import VPN.*)$
