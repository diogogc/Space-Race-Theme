# ==============================================================================
# 🚀 SPACE MISSION CONTROL // HYPRLOCK CONFIGURATION (NASA)
# Retro Apollo AGC DSKY & Mainframe Telemetry Lockscreen
# ==============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /home/diogo/.config/hypr/wallpaper-current.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.015
    contrast = 0.85
    brightness = 0.65
    vibrancy = 0.18
}

label {
    monitor =
    text = 🚀 NASA / APOLLO MISSION CONTROL // SECURE FLIGHT TELEMETRY TERMINAL
    color = rgba(255, 176, 0, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date -u +'%H:%M:%S UTC'
    color = rgba(244, 238, 219, 0.95)
    font_size = 52
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B %Y // STATION TIME: %H:%M %Z'
    color = rgba(180, 195, 210, 0.8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(255, 176, 0, 0.8)
    inner_color = rgba(20, 23, 29, 0.85)
    font_color = rgba(255, 176, 0, 1.0)
    
    fade_on_empty = false
    placeholder_text = <span foreground="##ffb000AA">[ AGC VERB 21: ENTER PASSCODE ]</span>
    hide_input = false
    rounding = 4
    
    check_color = rgba(46, 247, 136, 0.9)
    fail_color = rgba(255, 51, 51, 0.9)
    fail_text = <span foreground="##ff3333">[ 1202 ALARM: INVALID ACCESS KEY ]</span>
    
    capslock_color = rgba(255, 204, 0, 0.9)
    
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100000] echo "OPERATOR: $USER // GUIDANCE COMPUTER COLOSSUS 2A"
    color = rgba(150, 165, 180, 0.65)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = [ RESTRICTED ACCESS // MANNED SPACECRAFT CENTER // HOUSTON TEXAS ]
    color = rgba(120, 135, 150, 0.5)
    font_size = 10
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 30
    halign = center
    valign = bottom
}
