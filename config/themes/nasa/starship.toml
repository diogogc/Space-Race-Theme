"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](fg:muted)$os$custom$directory$git_branch$git_status$package$c$rust$golang$nodejs$python$cmd_duration
[╰─](fg:muted)$character"""

right_format = """$time"""

palette = "nasa_apollo"

[palettes.nasa_apollo]
bg_base = "#14171d"
bg_surface = "#1d232d"
amber = "#ffb000"
bright_amber = "#ffd166"
green = "#2ef788"
bright_green = "#51fa9f"
blue = "#457b9d"
bright_blue = "#64b5f6"
cyan = "#00d2ff"
red = "#e63946"
fg = "#e2e8f0"
muted = "#475569"

[character]
success_symbol = "[⫸](bold fg:amber)"
error_symbol = "[⫸](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[os]
disabled = false
style = "bg:bg_surface fg:cyan"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇 ARCH"
Linux = "󰌽 LINUX"

[custom.mission]
command = "echo NASA-MCC"
when = "true"
style = "bg:bg_surface fg:amber"
format = "[ 🚀 $output ]($style)[](fg:bg_surface bg:blue)"

[directory]
style = "bg:blue fg:fg"
format = "[  $path ]($style)[](fg:blue bg:bg_surface)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
style = "bg:bg_surface fg:green"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:bg_surface fg:amber"
format = "[$all_status$ahead_behind ]($style)[](fg:bg_surface)"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "󰹹 "
untracked = ""
stashed = "📦"
modified = "󱗜 "
staged = "✓"
renamed = "󰑕 "
deleted = "🗑 "

[cmd_duration]
min_time = 2_000
style = "fg:bright_amber"
format = "[ 󱐋 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:muted"
format = "[ 󱑎 $time UTC ]($style)"

[c]
symbol = " "
style = "fg:cyan"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "fg:amber"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "fg:cyan"
format = "[ $symbol($version) ]($style)"

[nodejs]
symbol = " "
style = "fg:green"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:bright_blue"
format = "[ $symbol(${version})( \\($virtualenv\\)) ]($style)"

[package]
symbol = "󰏗 "
style = "fg:muted"
format = "[ $symbol$version ]($style)"
