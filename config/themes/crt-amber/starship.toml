"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](fg:dim_amber)$os$custom$directory$git_branch$git_status$package$c$rust$golang$nodejs$python$cmd_duration
[╰─](fg:dim_amber)$character"""

right_format = """$time"""

palette = "crt_amber"

[palettes.crt_amber]
bg_base = "#0b0c0e"
bg_surface = "#1a1508"
amber = "#ffb000"
bright_amber = "#ffd166"
glow_amber = "#ff9e00"
dark_amber = "#cc7a00"
dim_amber = "#805200"
red = "#ff5500"
fg = "#ffb000"

[character]
success_symbol = "[⫸](bold fg:amber)"
error_symbol = "[⫸](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:bright_amber)"

[os]
disabled = false
style = "bg:bg_surface fg:amber"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇 ARCH-3270"
Linux = "󰌽 UNIX"

[custom.mission]
command = "echo CRT-AMBER"
when = "true"
style = "bg:bg_surface fg:bright_amber"
format = "[ 📟 $output ]($style)[](fg:bg_surface bg:dim_amber)"

[directory]
style = "bg:dim_amber fg:bright_amber"
format = "[  $path ]($style)[](fg:dim_amber bg:bg_surface)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
style = "bg:bg_surface fg:glow_amber"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:bg_surface fg:bright_amber"
format = "[$all_status$ahead_behind ]($style)[](fg:bg_surface)"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "󰹹 "
untracked = ""
stashed = "📦"
modified = "󱗜 "
staged = "✓"
renamed = "󰑕 "
deleted = "🗑 "

[cmd_duration]
min_time = 2_000
style = "fg:bright_amber"
format = "[ 󱐋 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:dim_amber"
format = "[ 󱑎 $time ]($style)"

[c]
symbol = " "
style = "fg:amber"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "fg:bright_amber"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "fg:glow_amber"
format = "[ $symbol($version) ]($style)"

[nodejs]
symbol = " "
style = "fg:amber"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:bright_amber"
format = "[ $symbol(${version})( \\($virtualenv\\)) ]($style)"

[package]
symbol = "󰏗 "
style = "fg:dim_amber"
format = "[ $symbol$version ]($style)"
