# ==============================================================================
# ⚡ CRT-AMBER // HYPRLOCK CONFIGURATION
# Retro IBM 7090 / DEC System 590nm Phosphor Telemetry Lockscreen
# ==============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /home/diogo/.config/hypr/wallpaper-current.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.02
    contrast = 0.90
    brightness = 0.60
    vibrancy = 0.20
}

label {
    monitor =
    text = ⚡ IBM 7090 // MAINFRAME TELEMETRY SECURE CHANNEL
    color = rgba(255, 158, 0, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date -u +'%H:%M:%S UTC'
    color = rgba(255, 179, 51, 0.95)
    font_size = 52
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B %Y // STATION: %H:%M %Z'
    color = rgba(230, 142, 0, 0.8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 0
    
    outer_color = rgba(255, 158, 0, 0.8)
    inner_color = rgba(14, 16, 20, 0.9)
    font_color = rgba(255, 158, 0, 1.0)
    
    fade_on_empty = false
    placeholder_text = <span foreground="##ff9e00AA">[ SYSIN: ENTER ACCESS KEY ]</span>
    hide_input = false
    rounding = 0
    
    check_color = rgba(255, 158, 0, 0.9)
    fail_color = rgba(255, 85, 51, 0.9)
    fail_text = <span foreground="##ff5533">[ ERR 0x590: ACCESS KEY REJECTED ]</span>
    
    capslock_color = rgba(255, 200, 0, 0.9)
    
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100000] echo "OPERATOR: $USER // MAINFRAME COMPLEX 36"
    color = rgba(180, 110, 0, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = [ LEVEL 4 CLEARANCE REQUIRED // 590NM PHOSPHOR SECURE TERMINAL ]
    color = rgba(140, 85, 0, 0.5)
    font_size = 10
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 30
    halign = center
    valign = bottom
}
