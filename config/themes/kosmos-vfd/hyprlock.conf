# ==============================================================================
# 🛰️ KOSMOS-VFD // HYPRLOCK CONFIGURATION
# Soviet Space Program Vacuum Fluorescent Display (VFD) Telemetry Lockscreen
# ==============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /home/diogo/.config/hypr/wallpaper-current.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.015
    contrast = 0.88
    brightness = 0.62
    vibrancy = 0.20
}

label {
    monitor =
    text = 🛰️ ЦУП КОСМОС // ЦЕНТР УПРАВЛЕНИЯ ПОЛЕТАМИ
    color = rgba(72, 229, 194, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date -u +'%H:%M:%S UTC'
    color = rgba(100, 245, 215, 0.95)
    font_size = 52
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B %Y // СТАНЦИЯ: %H:%M %Z'
    color = rgba(54, 184, 156, 0.8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(72, 229, 194, 0.8)
    inner_color = rgba(14, 30, 26, 0.9)
    font_color = rgba(72, 229, 194, 1.0)
    
    fade_on_empty = false
    placeholder_text = <span foreground="##48e5c2AA">[ БЦВК: ВВЕДИТЕ ПАРОЛЬ ]</span>
    hide_input = false
    rounding = 3
    
    check_color = rgba(72, 229, 194, 0.9)
    fail_color = rgba(255, 72, 96, 0.9)
    fail_text = <span foreground="##ff4860">[ ОШИБКА: ОТКАЗ В ДОСТУПЕ ]</span>
    
    capslock_color = rgba(255, 200, 0, 0.9)
    
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100000] echo "ОПЕРАТОР: $USER // БОРТОВОЙ ВЫЧИСЛИТЕЛЬ БИСВ"
    color = rgba(54, 184, 156, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = [ ЦУП МОСКВА-КОРОЛЕВ // ЦЕНТР УПРАВЛЕНИЯ ПОЛЕТАМИ ]
    color = rgba(34, 107, 92, 0.5)
    font_size = 10
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 30
    halign = center
    valign = bottom
}
