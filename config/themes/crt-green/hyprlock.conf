# ==============================================================================
# 📟 CRT-GREEN // HYPRLOCK CONFIGURATION
# Retro DEC VT100 / Matrix 525nm P1 Phosphor Telemetry Lockscreen
# ==============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /home/diogo/.config/hypr/wallpaper-current.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.02
    contrast = 0.90
    brightness = 0.60
    vibrancy = 0.20
}

label {
    monitor =
    text = 📟 DEC VT100 // SECURE MAINFRAME TELEMETRY CONSOLE
    color = rgba(51, 255, 51, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date -u +'%H:%M:%S UTC'
    color = rgba(100, 255, 100, 0.95)
    font_size = 52
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B %Y // STATION: %H:%M %Z'
    color = rgba(40, 204, 40, 0.8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 0
    
    outer_color = rgba(51, 255, 51, 0.8)
    inner_color = rgba(10, 16, 10, 0.9)
    font_color = rgba(51, 255, 51, 1.0)
    
    fade_on_empty = false
    placeholder_text = <span foreground="##33ff33AA">[ VT-100: ENTER SECURITY CODE ]</span>
    hide_input = false
    rounding = 0
    
    check_color = rgba(51, 255, 51, 0.9)
    fail_color = rgba(255, 68, 68, 0.9)
    fail_text = <span foreground="##ff4444">[ ERR 0x525: ACCESS DENIED ]</span>
    
    capslock_color = rgba(255, 200, 0, 0.9)
    
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100000] echo "OPERATOR: $USER // TTY01 MATRIX TERMINAL"
    color = rgba(30, 150, 30, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = [ RESTRICTED TELEMETRY STREAM // NORAD DEFENSE LINK ]
    color = rgba(24, 102, 24, 0.5)
    font_size = 10
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 30
    halign = center
    valign = bottom
}
