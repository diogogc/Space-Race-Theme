"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](fg:dim_green)$os$custom$directory$git_branch$git_status$package$c$rust$golang$nodejs$python$cmd_duration
[╰─](fg:dim_green)$character"""

right_format = """$time"""

palette = "crt_green"

[palettes.crt_green]
bg_base = "#0a0e0a"
bg_surface = "#101a10"
green = "#33ff33"
bright_green = "#66ff66"
dark_green = "#00aa00"
dim_green = "#1a401a"
red = "#ff4444"
fg = "#33ff33"

[character]
success_symbol = "[⫸](bold fg:green)"
error_symbol = "[⫸](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:bright_green)"

[os]
disabled = false
style = "bg:bg_surface fg:green"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇 ARCH-VT100"
Linux = "󰌽 UNIX"

[custom.mission]
command = "echo VT100-P1"
when = "true"
style = "bg:bg_surface fg:bright_green"
format = "[ 🖥 $output ]($style)[](fg:bg_surface bg:dim_green)"

[directory]
style = "bg:dim_green fg:bright_green"
format = "[  $path ]($style)[](fg:dim_green bg:bg_surface)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
style = "bg:bg_surface fg:green"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:bg_surface fg:bright_green"
format = "[$all_status$ahead_behind ]($style)[](fg:bg_surface)"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "󰹹 "
untracked = ""
stashed = "📦"
modified = "󱗜 "
staged = "✓"
renamed = "󰑕 "
deleted = "🗑 "

[cmd_duration]
min_time = 2_000
style = "fg:bright_green"
format = "[ 󱐋 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:dim_green"
format = "[ 󱑎 $time ]($style)"

[c]
symbol = " "
style = "fg:green"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "fg:bright_green"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "fg:green"
format = "[ $symbol($version) ]($style)"

[nodejs]
symbol = " "
style = "fg:dark_green"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:bright_green"
format = "[ $symbol(${version})( \\($virtualenv\\)) ]($style)"

[package]
symbol = "󰏗 "
style = "fg:dim_green"
format = "[ $symbol$version ]($style)"
