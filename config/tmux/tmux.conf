# ==============================================================================
# 🚀 SPACE RACE MISSION CONTROL // TMUX CONFIGURATION (.tmux.conf)
# ==============================================================================

# Terminal & Truecolor Capability
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ",*:Tc"

# Default Shell
set -g default-shell /home/diogo/.local/bin/zsh
set -g default-command /home/diogo/.local/bin/zsh

# Responsive Esc Key (critical for Vim / Neovim)
set -sg escape-time 0
set -g focus-events on

# 1-indexed Windows and Panes (matches keyboard 1-9)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Extended History & Buffer
set -g history-limit 50000

# Full Mouse Support (click, resize, scroll)
set -g mouse on

# Vi Mode in Copy Mode & Status Keys
setw -g mode-keys vi
set -g status-keys vi

# Copy Mode Keybindings (vi-style with wl-copy clipboard integration)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Intuitive Window Splitting (inherits current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easy Config Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "🚀 MISSION CONTROL // TMUX CONFIG RELOADED"

# ------------------------------------------------------------------------------
# STATUS BAR CONFIGURATION
# ------------------------------------------------------------------------------
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left

set -g status-left-length 40
set -g status-left " 🚀 MCC #[fg=default,bg=default] [#S] "

set -g status-right-length 80
set -g status-right " 🛰️ #H | %H:%M:%S UTC | %Y-%m-%d "

set -g window-status-separator ""
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #[bold]#I:#W#F "

# Load Active Mission Profile Theme
if-shell "test -f ~/.config/tmux/theme-current.conf" "source-file ~/.config/tmux/theme-current.conf"
